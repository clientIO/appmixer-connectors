name: Connector labels

# Label every PR with the connector(s) it touches, derived from its changed
# paths through .github/labeler.yml (generated by scripts/connector-labels.js).
#
# pull_request_target, because PRs here come from forks and a fork's
# pull_request token cannot write labels. It is safe in this job: nothing checks
# out or executes PR code — the labeler reads the changed-file list through the
# API and its configuration from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          # Never remove labels: people add connector labels by hand too.
          sync-labels: false
